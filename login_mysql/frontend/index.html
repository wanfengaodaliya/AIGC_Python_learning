<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户认证系统</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 450px;
        }
        .form-tab {
            display: none;
        }
        .form-tab.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-btn {
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #0d6efd;
            border-bottom: 2px solid #0d6efd;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            display: none;
        }
        .alert {
            animation: slideIn 0.3s ease-in-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 加载状态 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
    </div>

    <div class="auth-container">
        <h2 class="text-center mb-5">用户认证系统</h2>
        
        <!-- 标签页导航 -->
        <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link tab-btn active" id="login-tab" data-bs-target="#login" type="button" role="tab">登录</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link tab-btn" id="register-tab" data-bs-target="#register" type="button" role="tab">注册</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link tab-btn" id="reset-tab" data-bs-target="#reset" type="button" role="tab">重置密码</button>
            </li>
        </ul>

        <!-- 消息提示 -->
        <div id="message" class="mb-3"></div>

        <!-- 登录表单 -->
        <div class="form-tab active" id="login">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="loginUsername" name="username" required>
                    <div class="invalid-feedback">请输入用户名</div>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">密码</label>
                    <input type="password" class="form-control" id="loginPassword" name="password" required>
                    <div class="invalid-feedback">请输入密码</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">登录</button>
            </form>
        </div>

        <!-- 注册表单 -->
        <div class="form-tab" id="register">
            <form id="registerForm">
                <div class="mb-3">
                    <label for="registerUsername" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="registerUsername" name="username" minlength="3" maxlength="50" required>
                    <div class="invalid-feedback">用户名长度应在3-50个字符之间</div>
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label">密码</label>
                    <input type="password" class="form-control" id="registerPassword" name="password" minlength="6" required>
                    <div class="invalid-feedback">密码长度至少6个字符</div>
                </div>
                <div class="mb-3">
                    <label for="registerPhone" class="form-label">手机号</label>
                    <input type="tel" class="form-control" id="registerPhone" name="phone" minlength="10" maxlength="20" required>
                    <div class="invalid-feedback">请输入有效的手机号</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">注册</button>
            </form>
        </div>

        <!-- 密码重置表单 -->
        <div class="form-tab" id="reset">
            <form id="resetForm">
                <div class="mb-3">
                    <label for="resetPhone" class="form-label">手机号</label>
                    <input type="tel" class="form-control" id="resetPhone" name="phone" minlength="10" maxlength="20" required>
                    <div class="invalid-feedback">请输入有效的手机号</div>
                </div>
                <div class="mb-3">
                    <label for="resetNewPassword" class="form-label">新密码</label>
                    <input type="password" class="form-control" id="resetNewPassword" name="new_password" minlength="6" required>
                    <div class="invalid-feedback">密码长度至少6个字符</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">重置密码</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义脚本 -->
    <script>
        // API基础URL
        const API_BASE_URL = 'http://localhost:8000';

        // 显示加载状态
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // 显示消息
        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            // 3秒后自动关闭
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }

        // 标签页切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有标签页的active类
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.form-tab').forEach(tab => tab.classList.remove('active'));
                
                // 添加当前标签页的active类
                this.classList.add('active');
                const targetTab = this.getAttribute('data-bs-target');
                document.querySelector(targetTab).classList.add('active');
            });
        });

        // 表单验证
        function validateForm(form) {
            let isValid = true;
            const inputs = form.querySelectorAll('input[required]');
            
            inputs.forEach(input => {
                if (!input.value.trim()) {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else if (input.hasAttribute('minlength') && input.value.length < parseInt(input.getAttribute('minlength'))) {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else if (input.hasAttribute('maxlength') && input.value.length > parseInt(input.getAttribute('maxlength'))) {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else {
                    input.classList.remove('is-invalid');
                    input.classList.add('is-valid');
                }
            });
            
            return isValid;
        }

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validateForm(this)) {
                return;
            }
            
            showLoading();
            
            const formData = new FormData(this);
            const data = {
                username: formData.get('username'),
                password: formData.get('password')
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // 保存令牌到本地存储
                    localStorage.setItem('access_token', result.access_token);
                    localStorage.setItem('refresh_token', result.refresh_token);
                    showMessage('登录成功', 'success');
                    // 可以跳转到其他页面
                } else {
                    showMessage(result.detail || '登录失败', 'danger');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'danger');
            } finally {
                hideLoading();
            }
        });

        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validateForm(this)) {
                return;
            }
            
            showLoading();
            
            const formData = new FormData(this);
            const data = {
                username: formData.get('username'),
                password: formData.get('password'),
                phone: formData.get('phone')
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('注册成功，请登录', 'success');
                    // 切换到登录标签页
                    document.getElementById('login-tab').click();
                } else {
                    showMessage(result.detail || '注册失败', 'danger');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'danger');
            } finally {
                hideLoading();
            }
        });

        // 密码重置表单提交
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!validateForm(this)) {
                return;
            }
            
            showLoading();
            
            const formData = new FormData(this);
            const data = {
                phone: formData.get('phone'),
                new_password: formData.get('new_password')
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('密码重置成功，请登录', 'success');
                    // 切换到登录标签页
                    document.getElementById('login-tab').click();
                } else {
                    showMessage(result.detail || '密码重置失败', 'danger');
                }
            } catch (error) {
                showMessage('网络错误，请稍后重试', 'danger');
            } finally {
                hideLoading();
            }
        });

        // 实时验证
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value.trim()) {
                    if (this.hasAttribute('minlength') && this.value.length < parseInt(this.getAttribute('minlength'))) {
                        this.classList.add('is-invalid');
                        this.classList.remove('is-valid');
                    } else if (this.hasAttribute('maxlength') && this.value.length > parseInt(this.getAttribute('maxlength'))) {
                        this.classList.add('is-invalid');
                        this.classList.remove('is-valid');
                    } else {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                    }
                } else {
                    this.classList.remove('is-invalid');
                    this.classList.remove('is-valid');
                }
            });
        });
    </script>
</body>
</html>
