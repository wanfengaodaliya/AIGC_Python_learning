<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for循环练习 - 代码练习</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 顶部问题陈述展示区 -->
        <header class="problem-section">
            <h1>for循环练习</h1>
            <div class="steps">
                <p class="steps-title">步骤:</p>
                <p>1. 使用 <code>for</code> 循环计算1到100的和</p>
                <p>2. 使用 <code>print()</code> 函数输出计算结果</p>
                <p class="error-hint">⚠️ 错误提示：当前代码有两处错误：① range后缺少冒号 ② sum+=中缺少加号</p>
                <p class="expected-output">✓ 预期输出：<code>5050</code></p>
            </div>
        </header>

        <!-- 中间代码编辑区 -->
        <section class="code-section">
            <div class="code-header">
                <div class="window-controls">
                    <span class="control red"></span>
                    <span class="control yellow"></span>
                    <span class="control green"></span>
                </div>
            </div>
            <div class="code-editor">
                <div class="line-numbers">
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                    <div>4</div>
                </div>
                <textarea 
                    id="codeInput" 
                    class="code-textarea"
                    placeholder="在此输入代码..."
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                >sum = 0
for i in range(1, 101)
    sum = i
print(sum)</textarea>
            </div>

            <!-- 运行结果区域 -->
            <div id="outputArea" class="output-area"></div>

            <!-- 功能按钮 -->
            <div class="button-group">
                <button id="runBtn" class="btn btn-run">运行</button>
                <button id="submitBtn" class="btn btn-submit">提交</button>
            </div>
        </section>

        <!-- 底部海獭帮助界面 -->
        <footer class="otter-section">
            <div class="speech-bubble">有问题可以来问我哦</div>
            <div id="otterIcon" class="otter-icon">
                <img src="sea_otter.png" alt="小海獭">
            </div>
        </footer>
    </div>

    <!-- 模态弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div id="modalIcon" class="modal-icon"></div>
            <h2 id="modalTitle">结果状态</h2>
            <p id="modalMessage"></p>
            <button id="closeModalBtn" class="btn btn-close">关闭</button>
        </div>
    </div>

    <!-- 礼花庆祝特效Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <script src="level2.js"></script>
</body>
</html>
