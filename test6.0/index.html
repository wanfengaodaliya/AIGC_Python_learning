<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI对话系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 - 会话列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>会话列表</h3>
            </div>
            <div class="sessions-list" id="sessions-list">
                <!-- 会话列表将通过JS动态生成 -->
            </div>
            <button class="btn btn-primary new-chat-btn" onclick="createNewSession()">
                新建对话
            </button>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 标签页导航 -->
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#chat-tab">对话</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#history-tab">历史记录</a>
                </li>
            </ul>

            <!-- 标签页内容 -->
            <div class="tab-content">
                <!-- 对话标签页 -->
                <div class="tab-pane active" id="chat-tab">
                    <div class="chat-container">
                        <div class="chat-header">
                            <h2>AI对话系统</h2>
                            <div class="header-actions">
                                <span id="current-session-id" style="font-size: 14px;">新会话</span>
                            </div>
                        </div>
                        <div class="chat-body" id="chat-body">
                            <div class="message ai-message">
                                <p>你好！我是AI助手，有什么可以帮助你的吗？</p>
                            </div>
                        </div>
                        <div class="chat-footer">
                            <form id="chat-form">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="question" placeholder="请输入你的问题..." required>
                                    <button type="submit" class="btn btn-primary">发送</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 历史记录标签页 -->
                <div class="tab-pane" id="history-tab">
                    <div class="history-container">
                        <div class="history-header">
                            <h3>历史记录</h3>
                            <div class="header-actions">
                                <select id="history-session-filter" class="form-select form-select-sm">
                                    <option value="">所有会话</option>
                                </select>
                            </div>
                        </div>
                        <div class="history-body" id="history-body">
                            <!-- 历史记录将通过JS动态生成 -->
                        </div>
                        <div class="pagination" id="pagination">
                            <!-- 分页控件将通过JS动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
